<div class="meta">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time>
  {{ if .Draft }}<span>Entwurf</span>{{ end }}
  {{ with .GetTerms "tags" }}
  <ul class="tags" aria-label="Tags">{{ range . }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}</ul>
  {{ end }}
</div>
