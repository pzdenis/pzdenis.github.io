{{ if . }}
<ul class="posts">
  {{ range .ByDate.Reverse }}
  <li>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{ partial "post-meta.html" . }}
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </li>
  {{ end }}
</ul>
{{ else }}
<p class="empty">Noch keine Beiträge veröffentlicht.</p>
{{ end }}
