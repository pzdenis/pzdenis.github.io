name: Hugo → GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.162.1'
  TZ: Europe/Berlin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/hugo"
          curl --fail --silent --show-error --location \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/hugo.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
      - name: Build
        run: |
          hugo version
          hugo --environment production --minify --gc --cleanDestinationDir \
            --buildDrafts=false --buildFuture=false --buildExpired=false \
            --cacheDir "${RUNNER_TEMP}/hugo-cache"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
